name: Deploy Application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/devops-demo-api

jobs:

  # ── 1. Lint & Test ──────────────────────────────────────────────────────────
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: |
          pip install -r app/requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Lint Code
        run: ruff check app/

      - name: Run Tests
        env:
          DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379
          APP_ENV: test
          PYTHONPATH: .
        run: |
          if [ -d "app/tests" ]; then
            pytest app/tests/ -v --tb=short
          else
            echo "No tests directory found, skipping tests."
          fi

  # ── 2. Build & Push Image ───────────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Environment File
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config

      - name: Set Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy to VPS ────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production

    steps:
      - name: Deploy Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            set -e

            cd ~/fastapi-production-stack

            echo "Pulling latest source..."
            git pull origin main

            echo "Logging into GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | \
            docker login ghcr.io \
              -u ${{ github.actor }} \
              --password-stdin

            export IMAGE_TAG=sha-${{ needs.build.outputs.sha_short }}
            export DOCKER_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

            echo "Pulling latest API image..."
            docker compose pull
            docker compose -f docker-compose.yml \
            -f docker-compose.monitoring.yml \
            up -d

            echo "Updating API container..."
            docker compose up -d

            echo "Reloading NGINX..."
            if docker compose ps nginx | grep -q "Up"; then
            docker compose exec -T nginx nginx -s reload
            fi

            echo "Cleaning old images..."
            docker image prune -f

            echo "✅ Deployment completed successfully."

      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost/health")

            if [ "$STATUS" != "200" ]; then
              echo "❌ Health check failed with status $STATUS"
              exit 1
            fi

            echo "✅ Health check passed."

